name: graphics

on:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/graphics.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "Prasun Kumar"
          git config user.email "prasun.code@gmail.com"
          git add assets/skyline.svg assets/scores.svg
          git diff --cached --quiet || (git commit -m "Update profile graphics" && git pull --rebase && git push)
